# probe configuration. Committed. Secrets live in env only.
#
# This file SEEDS the database. On worker boot each [campaigns.*] block is
# upserted into `campaigns` by slug: static fields are overwritten from this
# file, runtime-mutable state (paused, warmup_start) is never touched.
# Everything at runtime reads the table, never this file.

[global]
timezone      = "Europe/Copenhagen"
send_days     = ["mon", "tue", "wed", "thu", "fri"]
send_window   = ["09:00", "16:00"]
gap_floor_minutes = 4
gap_jitter    = 0.4

# §9.1 jurisdiction gate. A BLOCKLIST: every country not named here is
# contactable, and so is a lead whose country could not be established at all.
# That last part is the one to remember. On the first real intake, 60 of 62
# leads resolved to no country, so "unknown" is the ordinary case and it now
# passes. The loader refuses to start if "DK" is ever removed from this list.
blocked_countries = ["DK", "DE"]

# CAN-SPAM footer requirement (§9.2.7).
#
# ---> THIS IS THE ONE LINE YOU MUST EDIT BEFORE ANYTHING CAN BE APPROVED. <---
#
# The copy lint rejects a placeholder, so while this line reads as it does, every
# email fails the lint at generation, at approval and at dispatch. `pnpm dry-run`
# shows it on every fixture. That is deliberate: the lint cannot tell a real
# address from a fake one, so it rejects anything with angle brackets, anything
# with no street number or postcode, and anything carrying template vocabulary.
# A real address passes; nothing else does.
#
# The company name is not required here and has been dropped: CAN-SPAM asks for
# a valid physical postal address, not a legal entity. The street cannot go the
# same way. An email with no deliverable address is a per-message violation, and
# the lint below refuses to approve one, which is the whole reason the rule
# exists. If the home address is the problem rather than the company name, the
# fix is a different address that is still real: a virtual office or a PO box,
# which is a few hundred kroner a year and changes one line in this file.
postal_address = "exit1.dev, Bogfinkevej 2, 7400 Herning, Denmark"

# Public base URL of apps/web. Unsubscribe, click and data-notice links.
public_base_url = "https://probe.exit1.dev"

# §6 generator contract
generator_concurrency  = 3
generator_timeout_ms   = 30000
generator_budget_ms    = 7200000   # two hours, elapsed-time budget
generator_max_attempts = 3
# Lower is stronger. 1 is a defect, 0 is a clean report saying every check
# passed, and both are mailed. 2 is pedantic and never mailed on its own.
generator_min_severity = 1

# §5.5 auto-pause thresholds (half of AWS's)
complaint_rate_threshold = 0.0005
bounce_rate_threshold    = 0.03
rate_window_days         = 7

# §8.3 paid lookup cap, last resort only
paid_lookup_monthly_cap = 50

# Sending identities below must be on a domain VERIFIED IN DAY3 (§5.1), under
# Domains in the Day3 dashboard. probe does not hold AWS credentials: Day3 owns
# the SES account and the reputation, and probe is one more caller of its
# transactional API. Any local part on a verified domain works, with no
# pre-created sender.

[campaigns.exit1]
product       = "exit1.dev"
# The Cloud Function directly, not exit1.dev/api/probe/generate: exit1.dev is
# served by Vercel with no vercel.json, so the Firebase Hosting rewrites in that
# repo are inert. This call is machine to machine, so the URL only has to work.
generator_url = "https://europe-west1-exit1-dev.cloudfunctions.net/probeGenerate"
from_name     = "Morten Pradsgaard"
from_email    = "morten@mail.exit1.dev"
reply_to      = "morten@mail.exit1.dev"
daily_cap     = 50
exclude_tags  = ["monitoring", "observability", "uptime", "status-page", "apm"]
exclude_keywords = ["uptime monitor", "status page", "observability", "monitoring platform", "apm", "incident management"]

[campaigns.day3]
product       = "day3.app"
# NOT ROUTABLE. day3.app has no /api/probe/generate: the URL below returns the
# marketing site's 404 page. Matching is round robin, so while this was routable
# it took half of every intake: 29 of the first 61 leads, and every one of them
# that got as far as a generator call spent it collecting 404s. Flip this to
# true the day the endpoint ships, and not before.
routable      = false
generator_url = "https://day3.app/api/probe/generate"
from_name     = "Morten Pradsgaard"
from_email    = "morten@mail.day3.app"
reply_to      = "morten@mail.day3.app"
daily_cap     = 25
exclude_tags  = []
exclude_keywords = []
